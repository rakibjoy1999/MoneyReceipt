<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BD Medical Research and Consultancy - Invoice</title>
<style>
body{font-family:"Times New Roman",serif;background:#f2f2f2;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border:2px solid #000}
input,button{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
.flex{display:flex;gap:10px}.flex>div{flex:1}
.receipt{border:1px solid #000;padding:15px;margin-top:20px}
.center{text-align:center}
img.logo{width:120px;height:120px;object-fit:cover}
table{width:100%}
</style>
</head>
<body>
<div class="container">
<h2>BD Medical Research and Consultancy</h2>
<input id="receiptNo" placeholder="Receipt No">
<input id="name" placeholder="Client Name">
<div class="flex">
<div><input id="contract" placeholder="Contract Amount"></div>
<div><input id="paid" placeholder="Paid Amount"></div>
</div>
<input id="purpose" placeholder="Purpose">
<input id="amountText" placeholder="Amount in Words">
<input id="date" type="date">

<h3>Article Titles</h3>
<div id="items"></div>
<button onclick="addItem()">+ Add Article</button>

<p>Logo</p><input type="file" onchange="loadLogo(event)">
<p>Signature</p><input type="file" onchange="loadSign(event)">
<p>Received By Photo</p><input type="file" onchange="loadPhoto(event)">
<button onclick="generateReceipt()">Generate Invoice</button>

<div class="receipt">
<div class="center">
<img id="receiptLogo" class="logo" src="">
<h2>JOURNAL INVOICE / MONEY RECEIPT</h2>
</div>
<p><b>Receipt:</b> <span id="rNo"></span></p>
<p><b>Client:</b> <span id="rName"></span></p>
<p><b>Purpose:</b> <span id="rPurpose"></span></p>
<p><b>Date:</b> <span id="rDate"></span></p>
<ul id="rArticles"></ul>
<hr>
<table>
<tr>
<td align="center">
<img id="signPreview" style="width:180px;height:80px;display:none"><br>
_____________________<br><b>Received By</b><br>Rakib Joy
</td>
<td align="center">
<img id="photoPreview" style="width:120px;height:140px;border:1px solid #000;display:none;object-fit:cover"><br>
Passport Size Photo
</td>
</tr>
</table>
</div>
</div>
<script>
let count=0;
function addItem(){
 const d=document.createElement('div');
 d.innerHTML='<input placeholder="Article Title">';
 document.getElementById('items').appendChild(d);
}
addItem();
function loadLogo(e){
 let u=URL.createObjectURL(e.target.files[0]);
 document.getElementById('receiptLogo').src=u;
}
function loadSign(e){
 let u=URL.createObjectURL(e.target.files[0]);
 let i=document.getElementById('signPreview');
 i.src=u;i.style.display='block';
}
function loadPhoto(e){
 let u=URL.createObjectURL(e.target.files[0]);
 let i=document.getElementById('photoPreview');
 i.src=u;i.style.display='block';
}
function generateReceipt(){
 rNo.textContent=receiptNo.value;
 rName.textContent=name.value;
 rPurpose.textContent=purpose.value;
 rDate.textContent=date.value;
 let ul=document.getElementById('rArticles');
 ul.innerHTML='';
 document.querySelectorAll('#items input').forEach(x=>{
   if(x.value){let li=document.createElement('li');li.textContent=x.value;ul.appendChild(li);}
 });
}
</script>
</body>
</html>
